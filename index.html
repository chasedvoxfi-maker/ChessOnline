<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Chess Online</title>

    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="theme-color" content="#0a0812" />

    <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />

    <!-- Start fetching the menu background as early as possible — otherwise it's only
         discovered once the CSS applies it, well after the JS bundle has loaded. -->
    <link rel="preload" as="image" href="/ChessOnline/menu-bg-desktop.webp" media="(min-width: 700px)" />
    <link rel="preload" as="image" href="/ChessOnline/menu-bg.webp" media="(max-width: 699.98px)" />

    <!-- Same idea for the tabletop photo textures (both table themes): they're only discovered
         once the 3D scene builds the table mesh, well after the JS bundle has loaded and parsed. -->
    <link rel="preload" as="image" href="/ChessOnline/textures/table-photo.webp" />
    <link rel="preload" as="image" href="/ChessOnline/textures/table-photo-dark.webp" />

    <!-- iOS: launch full-screen from the home screen, no Safari chrome -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Chess Online" />

    <!-- Android / other browsers supporting the standard install prompt -->
    <meta name="mobile-web-app-capable" content="yes" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
